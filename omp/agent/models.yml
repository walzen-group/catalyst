# omp custom model providers, bind-mounted at ~/.omp/agent/models.yml.
# Only the providers named here are affected; omp's built-in catalog
# (kimi-code, opencode-go, ...) stays as is. See docs/concepts/devcontainer.md.
#
# The models below are Neuralwatt's GET /v1/models as of 2026-07-28, one entry per id.
# ids come from that endpoint, not the Hugging Face names in the upstream recipe. Every
# field is taken from the model's own metadata: contextWindow from
# limits.max_context_length, cost from pricing (per million, cacheRead from
# cached_input_per_million), input from capabilities.vision, reasoning from
# capabilities.reasoning. Where the API publishes no max_output_tokens, maxTokens is
# 65536, which keeps omp off its 32768 default without claiming a cap the API does not
# state. Refresh the list with:
#   curl -H "Authorization: Bearer $NEURALWATT_API_KEY" https://api.neuralwatt.com/v1/models
#
# Suffixes: -fast serves with thinking off, -short is the 200K pool with a bounded
# reasoning budget, -flex is the discounted async tier that holds requests during peak
# until capacity frees up, so it suits overnight batches and reviews.
providers:
  neuralwatt:
    baseUrl: https://api.neuralwatt.com/v1
    api: openai-completions
    # A leading ! makes omp run the rest as a shell command and take its output
    # as the key (a plain value would be read as an env var name, or as the key
    # itself). So the key comes straight out of the host secrets dir that
    # devcontainer.json mounts at ~/.secrets, with no environment to set up and
    # nothing cached in the image. omp resolves this per request and memoises
    # the result, so an edited file is picked up by the next session.
    # stderr is dropped so a missing file cannot scribble on the TUI mid-session;
    # omp reports the empty result as "No active credential found" on its own.
    apiKey: '!. $HOME/.secrets/.neuralwatt.env 2>/dev/null && printf %s "$NEURALWATT_API_KEY"'
    # Neuralwatt needs Authorization: Bearer <key>, and its OpenAI-compatible
    # API rejects the developer role. compat replaces the built-in block
    # wholesale, so both fields have to be spelled out. omp merges a model's own
    # compat over this one, so the models whose metadata reports
    # capabilities.reasoning_effort raise supportsReasoningEffort again below.
    authHeader: true
    compat:
      supportsDeveloperRole: false
      supportsReasoningEffort: false
    models:
      # Kimi K3, the flagship, and the priciest here by a factor of three. That is why
      # it stays out of modelRoles in config.yml and gets picked per session with /model.
      - id: kimi-k3
        name: Kimi K3
        reasoning: true
        input: [text, image]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 3.0, output: 15.0, cacheRead: 0.3, cacheWrite: 0 }

      # Kimi K2.6
      - id: kimi-k2.6
        name: Kimi K2.6
        reasoning: true
        input: [text, image]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.69, output: 3.22, cacheRead: 0.1725, cacheWrite: 0 }
      - id: kimi-k2.6-fast
        name: Kimi K2.6 Fast
        reasoning: false
        input: [text, image]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.69, output: 3.22, cacheRead: 0.1725, cacheWrite: 0 }
      - id: kimi-k2.6-flex
        name: Kimi K2.6 (flex)
        reasoning: true
        input: [text, image]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.69, output: 3.22, cacheRead: 0.1725, cacheWrite: 0 }

      # Kimi K2.7 Code
      - id: kimi-k2.7-code
        name: Kimi K2.7 Code
        reasoning: true
        input: [text, image]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.95, output: 4.0, cacheRead: 0.2375, cacheWrite: 0 }
      - id: kimi-k2.7-code-flex
        name: Kimi K2.7 Code (flex)
        reasoning: true
        input: [text, image]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.95, output: 4.0, cacheRead: 0.2375, cacheWrite: 0 }

      # GLM-5.2 at 1M context. The whole family reports reasoning_effort support.
      - id: glm-5.2
        name: GLM-5.2
        reasoning: true
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }
      - id: glm-5.2-fast
        name: GLM-5.2 (fast)
        reasoning: false
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }
      - id: glm-5.2-flex
        name: GLM-5.2 (flex)
        reasoning: true
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }

      # GLM-5.2 short, the 200K pool. Grant-gated private preview, so these four answer
      # only if the key has been granted access.
      - id: glm-5.2-short
        name: GLM-5.2 (short)
        reasoning: true
        input: [text]
        contextWindow: 199984
        maxTokens: 32000
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }
      - id: glm-5.2-short-fast
        name: GLM-5.2 (short, fast)
        reasoning: false
        input: [text]
        contextWindow: 199984
        maxTokens: 32000
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }
      - id: glm-5.2-short-flex
        name: GLM-5.2 (short, flex)
        reasoning: true
        input: [text]
        contextWindow: 199984
        maxTokens: 32000
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }
      - id: glm-5.2-short-fast-flex
        name: GLM-5.2 (short, fast, flex)
        reasoning: false
        input: [text]
        contextWindow: 199984
        maxTokens: 32000
        cost: { input: 1.45, output: 4.5, cacheRead: 0.3625, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true }

      # Qwen3.5 397B
      - id: qwen3.5-397b
        name: Qwen3.5 397B
        reasoning: true
        input: [text]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.69, output: 4.14, cacheRead: 0.1725, cacheWrite: 0 }
      - id: qwen3.5-397b-fast
        name: Qwen3.5 397B Fast
        reasoning: false
        input: [text]
        contextWindow: 262128
        maxTokens: 65536
        cost: { input: 0.69, output: 4.14, cacheRead: 0.1725, cacheWrite: 0 }

      # Qwen3.6 35B, the cheap multimodal pair at 131K context.
      - id: qwen3.6-35b
        name: Qwen3.6 35B
        reasoning: true
        input: [text, image]
        contextWindow: 131056
        maxTokens: 65536
        cost: { input: 0.29, output: 1.15, cacheRead: 0.0725, cacheWrite: 0 }
      - id: qwen3.6-35b-fast
        name: Qwen3.6 35B Fast
        reasoning: false
        input: [text, image]
        contextWindow: 131056
        maxTokens: 65536
        cost: { input: 0.29, output: 1.15, cacheRead: 0.0725, cacheWrite: 0 }

      # DeepSeek V4 Flash: 1M context at a tenth of a cent per million in, the cheapest
      # reasoning model on the list. Note config.yml's smol and tiny roles point at
      # opencode-go/deepseek-v4-flash, a different provider serving the same model.
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        reasoning: true
        input: [text]
        contextWindow: 1048560
        maxTokens: 65536
        cost: { input: 0.104, output: 0.207, cacheRead: 0.026, cacheWrite: 0 }
        compat: { supportsReasoningEffort: true, extraBody: { top_p: 0.95 } }

      # Gemma 4 31B, the cheapest here. Multimodal, and the only entry with a published
      # image cap (4) and no reasoning.
      - id: gemma-4-31b
        name: Gemma 4 31B
        reasoning: false
        input: [text, image]
        contextWindow: 262128
        maxTokens: 16384
        cost: { input: 0.144, output: 0.42, cacheRead: 0.036, cacheWrite: 0 }

  # Override-only block: no models list, so omp merges these overrides into its
  # built-in opencode-go provider without replacing it. deepseek-v4-flash is the
  # model behind the default, smol, tiny and task roles; top_p 0.95 per request.
  # The neuralwatt deepseek-v4-flash entry above gets the same value so both
  # variants behave identically.
  opencode-go:
    modelOverrides:
      deepseek-v4-flash:
        compat:
          extraBody:
            top_p: 0.95
