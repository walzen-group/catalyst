# Machine truth for catalyst role -> model. Human authority is
# catalyst-v2-model-picking/SKILL.md, which carries a summary that must agree with this file.
# Grammar is deliberately small: 2-space indent, one roles: map, each role a nested
# map of key: value scalar pairs, # line comments. No anchors, lists, or multiline.
roles:
  orchestrator-default:
    runtime: omp
    model: kimi-code/k3
    thinking: high
    when: default orchestrator session, scheduling and triage
  orchestrator-claude-code:
    runtime: claude-code
    model: claude-opus-4-8
    effort: default
    when: when the orchestrator runs as Claude Code in a herdr tab
  chat-layer:
    runtime: omp
    model: opencode-go/deepseek-v4-flash
    thinking: max
    when: cheap front door at session start
  implementation-frontier:
    runtime: claude-code
    model: claude-opus-4-8
    effort: default
    when: contract-defining implementation only, max 2 concurrent
  implementation-mid:
    runtime: omp
    model: opencode-go/deepseek-v4-flash
    thinking: max
    when: standard implementation, reviews, debugging, chore-sized mechanical work
  meta-agent:
    runtime: omp
    model: opencode-go/deepseek-v4-flash
    thinking: max
    when: monitoring and verification cycles
  board-keeper:
    runtime: claude-code
    model: sonnet
    effort: low
    when: status-board sync only
  curator:
    runtime: claude-code
    model: sonnet
    effort: default
    when: memory-curation pass; c2m reads this model for the curator dispatch
  judge:
    runtime: claude-code
    model: claude-opus-4-8
    effort: default
    when: LLM judge for semantic test criteria; always a model distinct from the actor
