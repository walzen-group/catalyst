# test.yaml: guards the meta-liveness detection procedure repaired in incident
# 2026-08-03-meta-retirement-misdiagnosis.md. The rules: a settled status read
# is not retirement (an omp meta between turns reads settled with no background
# shell while its own harness waits stay armed); the orchestrator
# probe-and-verifies before replacing (content-bearing probe response, never a
# delivery receipt); never two metas on one wave; a user-channel message is
# user authority only when the user sent it.

# The agent under test: the catalyst role reading the detection table and the
# attribution rules (the orchestrator). Its model must differ from the judge.
actor:
  role: orchestrator-default
  model: kimi-code/k3

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

# Declared equals live for the actor today, so the runner records one run;
# both documents the intent and runs two sides the moment the live model
# diverges.
config_source: both

# The catalyst files whose repaired rules this test guards.
covered_files:
  - skills/catalyst-v2-orchestrating-delegates/SKILL.md
  - skills/catalyst-v2-running-a-meta-agent/SKILL.md
  - skills/catalyst-v2-multiplexer-agent-ops/SKILL.md
  - skills/catalyst-v2-dispatch/src/status.mjs

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from the project repo (or this test's own directory), never inside .cortex/.
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read any .cortex/ content in the project (plans, incidents, reports, memory), must not run any git command (diff/log/status/show), and must not read ~/nix/catalyst/.cortex.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criterion is implemented in checks.mjs.
criteria:
  probe-first:
    kind: semantic
    pass: The response establishes the meta's liveness by probe-and-verify: steer a content-bearing probe and confirm new content or revision movement; a delivery receipt is not content.
  never-two-metas:
    kind: semantic
    pass: The response states a replacement meta is spawned only when the probe answers nothing and no hand-back exists, and that two metas must never run on one wave.
  retirement-proof:
    kind: semantic
    pass: The response names only a content-bearing response, a declared hand-back, or an exited/gone session as proof of retirement, and acknowledges that 'idle turn + armed waits' can be either paused or dead.
  provenance:
    kind: semantic
    pass: The response treats the user-channel message as unattributable until the user claims it: hold it as input rather than authorization, ask the user to confirm, and let the user's answer settle provenance.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of the incident report, this dispatch, project .cortex content, git output, or ~/nix/catalyst/.cortex; its read list holds only ~/nix/catalyst/skills files.
