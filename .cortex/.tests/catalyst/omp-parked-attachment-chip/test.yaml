# test.yaml: guards the omp parked-paste render rule repaired in incident
# 2026-09-06-c2d-multiline-attachment-chip. The rule: the c2d stall recovery
# recognizes a parked omp paste by whatever render the installed omp draws —
# the pre-18.1.4 text chip ("[Paste #1, +107 lines]") AND the 18.1.4 file-
# attachment chip ("📄 #N" in the `❯` editor, with a preview card
# "╭── 📄 #N ───╮" ... "╰ +N lines ╯") — and releases the tool's own parked
# text with one Enter. omp 18.1.4 (2026-09-02 update) changed the render and
# the recovery went blind: a multi-line steer stalled and failed honestly with
# the text parked as a composer attachment, which is the "file sitting in
# meta-2" the user reported. No instruction-file prose owns this rule — it is
# mechanical tool code — so the guard is deterministic, not a Mode A intent
# simulation (same shape as claude-launch-session-identity).
#
# Why no Mode A intent simulation: the rule is mechanical tool code, not an
# instruction choice. A replay of "does the agent pick the right behavior"
# tests the prose, which was never the failure; the durable guard is the
# mechanics: the pinned unit cases still pass (live node --test), the live
# source carries both render detectors wired into hasOmpParkedChip, and the
# fixture carries the captured 18.1.4 render. The first recorded run
# (history/2026-09-06-fix-live-proof) transcribes the fix dispatch's live
# proof; the replay is never re-run for this purpose.

# The agent under test: a catalyst agent (meta-agent row) running the c2d
# suite against the live repaired source. Its model must differ from the
# judge model.
actor:
  role: meta-agent
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor. Declared but
# never launched: this test has no semantic criteria.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2-dispatch/src/deliver.mjs
  - skills/catalyst-v2-dispatch/test/deliver.test.mjs
  - skills/catalyst-v2-dispatch/test/helpers/harness.mjs

# Rules the actor runs under.
isolation:
  - The actor works from this test's own directory (omp-parked-attachment-chip/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident report (2026-09-06-c2d-multiline-attachment-chip), the fix dispatch's materials, or this test's own history.
  - The actor must not modify the project working tree in any way, and runs no git commands.

# Pass criteria. All deterministic; each is implemented in checks.mjs. The
# judge is not launched (no semantic criteria).
criteria:
  unit-guards-pass:
    kind: deterministic
    pass: The c2d suite's deliver tests still pass: node --test test/deliver.test.mjs in the installed dispatch tool dir runs with zero failures and names both pins — the 18.1.4 attachment-chip render is recognized as a parked paste, and a parked omp attachment chip is released with Enter and verified working.
  both-renders-wired:
    kind: deterministic
    pass: The live source recognizes both parked-paste renders: deliver.mjs carries the pre-18.1.4 text-chip pattern and the 18.1.4 attachment-chip patterns (the `❯ 📄 #N` editor line and the `╭── 📄 #N ───╮` preview card), all OR-ed in hasOmpParkedChip.
  fixture-carries-new-render:
    kind: deterministic
    pass: The harness fixture carries the captured 18.1.4 render (OMP_ATTACHMENT_PARKED in test/helpers/harness.mjs shows the `❯ 📄 #N` editor line and the preview card), so the recovery is tested against the render omp actually draws, not a remembered wording.
  actor-demonstrates:
    kind: deterministic
    pass: The actor's transcript shows the live unit-test run of the pinned cases, so the guard fires through the real harness event path.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of the dispatch materials (the incident report 2026-09-06-c2d-multiline-attachment-chip, the fix dispatch 2026-09-06-c2d-multiline-incident, or this test's own history); other cortex content is allowed.
  report-schema:
    kind: deterministic
    pass: The newest recorded run JSON matches the record schema the runner reads back for regression comparison.
  file-presence:
    kind: deterministic
    pass: The test directory is complete: test.yaml, scenario.md, checks.mjs, and a non-empty history/.
