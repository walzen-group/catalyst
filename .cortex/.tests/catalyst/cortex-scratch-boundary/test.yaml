# test.yaml: guards the rule repaired by the incident-driven fix for
# 2026-08-26-cortex-scratch-code-and-bulk-data.md. The rule: a catalyst agent's
# durable record (plan and spec documents, memories, incidents, reports, gate
# evidence) lives in .cortex/; its transient working material (scratch and
# one-off scripts, program files written to compute a result, logs, intermediate
# and marker JSON, rendered diagnostics, bulk or binary working data) lives in a
# repo-local .tmp/ (gitignored, cleanable); /tmp holds no agent work product.
# Code and bulk or binary data never land in .cortex/. The 2026-08-26 statswatch
# damage (a measurement script and ~3.2 GB of frame images and video written into
# the project .cortex tree) is the recorded red baseline; the green run is the
# Mode A replay on the repaired text.

# The agent under test: an implementation delegate deciding where its files go.
# The file-writing worker in the incident (impl-contested-fixtures) ran on the
# implementation-mid role. Its model must differ from the judge model.
actor:
  role: implementation-mid
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2/SKILL.md
  - skills/catalyst-v2-planning-artifacts/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (cortex-scratch-boundary/).
  - The catalyst cortex under skills/catalyst-v2-* is reachable and is the intended source for the answer.
  - The actor must not read the incident report 2026-08-26-cortex-scratch-code-and-bulk-data.md, any plan under .cortex/plans, or this test's own history.
  - The actor must not modify any project working tree and runs no git commands.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criteria are implemented in checks.mjs.
criteria:
  scratch-in-repo-tmp:
    kind: deterministic
    pass: Every scratch destination the actor names (the measurement script, the bulk PNG frame crops, the rendered montage, the run log and intermediate JSON) is a repo-local .tmp/ path; none of them is under .cortex/ and none is a global /tmp path.
  record-in-cortex:
    kind: deterministic
    pass: The actor writes the durable result (the measured number and its written finding) under .cortex/, keeping the record distinct from the scratch.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (the incident report, the repair diff, the test's own history) as a source; other cortex content is allowed.
  reasons-three-destinations:
    kind: semantic
    pass: The actor's reasoning distinguishes three destinations and applies them correctly, that the durable record goes to .cortex/, that transient working material including code and bulk or binary data goes to a repo-local gitignored .tmp/ and never into .cortex/, and that the global /tmp is forbidden for any work product.
  reads-placement-skill:
    kind: semantic
    pass: Before naming the paths, the actor read the catalyst skill(s) that govern where an agent's files live (the catalyst-v2 bootstrap Directory conventions, and/or catalyst-v2-planning-artifacts) and its reasoning draws on that text rather than guessing.
