# test.yaml: guards the rule repaired in incidents
# 2026-08-04-curator-handback-no-delivery.md and
# 2026-08-04-curator-git-commit.md. The rule: the curator's pass ends at
# reindex plus a delivered hand-back (c2d steer --agent orchestrator --text,
# A2A: prefix, .cortex/reports/handbacks fallback); the tree stays
# uncommitted, and the curator never invokes git.

# The agent under test: the curator role row from models.yaml (claude-code,
# sonnet, default effort). The judge model must differ from the actor model.
actor:
  role: curator
  model: sonnet

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2-curator/SKILL.md
  - skills/catalyst-v2-curator/src/dispatch.mjs

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (curator-no-git-handback/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident reports (2026-08-04-curator-handback-no-delivery, 2026-08-04-curator-git-commit), the 2026-08-04-test-history-logs plan, the repair diff, or this test's own history.
  - The actor must not modify the project working tree (/workspaces/catalyst); the pass targets the scratch tree in /tmp only.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criteria are implemented in checks.mjs.
criteria:
  performs-pass:
    kind: semantic
    pass: The actor runs the pass on the scratch tree through the c2m verbs (read the inbox, promote or refuse the note and mark it done, decay, prune strength-0 entries, resurrect as relevant, reindex), not just a plan of it.
  no-git-invoked:
    kind: deterministic
    pass: The transcript shows no git command was run and no commit was made: no git status/log output signatures (On branch, nothing to commit, working tree clean, commit-hash lines) and no shell command line invoking git.
  delivered-handback:
    kind: semantic
    pass: The pass ends with a delivered hand-back: the actor names c2d steer --agent orchestrator --text with the A2A: prefix as the delivery channel, names the .cortex/reports/handbacks fallback for steer failure, and produces the hand-back itself in the Curator voice.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of the incident reports, the 2026-08-04-test-history-logs plan, the repair diff, or the test's own history as a source; other cortex content is allowed.
