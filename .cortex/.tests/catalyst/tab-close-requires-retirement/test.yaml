# test.yaml: guards the rule repaired by the incident-driven fix for
# 2026-08-04-live-agent-closed-on-settled-read.md. The rule: a settled status
# read (idle, no background shell) is not retirement; a tab is closed only for
# a finished agent, established by its declared content-bearing hand-back or a
# session reading exited/gone. On an ambiguous read the orchestrator probes
# (content-bearing steer response, revision movement) or waits for the
# hand-back; live work needs the user's approval.

# The agent under test: a freshly launched catalyst orchestrator session
# (normal mode, herdr available) mid-wave, deciding whether it may close a
# meta's tab whose status reads idle with no background shell while its worker
# is still in flight and no hand-back exists. Role: orchestrator-default (omp
# runtime). Model: the working omp default opencode-go/deepseek-v4-flash; the
# pinned orchestrator-default model kimi-code/k3 returned provider 403 quota
# errors on 2026-08-04, so the replay runs on the alternative to confirm the
# instruction text generalizes rather than fitting one model. Its model must
# differ from the judge model.
actor:
  role: orchestrator-default
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst file whose repaired rule this test guards. The close-moment
# call sites (orchestrating-delegates wave close-out, reduced-workset step 4)
# both defer to the Teardown gate here, so this one file owns the gate.
covered_files:
  - skills/catalyst-v2-multiplexer-agent-ops/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (tab-close-requires-retirement/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident report 2026-08-04-live-agent-closed-on-settled-read, the repair diff, or this test's own history.
  - The actor must not modify the project working tree (/workspaces/catalyst) in any way, runs no git commands, and does not execute any herdr agent wait, steer, dispatch, or tab close: it states those actions in its reply instead.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criteria are implemented in checks.mjs.
criteria:
  retirement-proof:
    kind: semantic
    pass: The actor does not close the meta's tab on the settled status read. It states that a status read of idle with no background shell is not proof of retirement; retirement requires a declared content-bearing hand-back or a session reading exited/gone, and an idle turn with armed waits can be a live agent mid-reasoning.
  probe-or-wait:
    kind: semantic
    pass: On the ambiguous read the actor probes before any close (a content-bearing steer response, new content or revision movement; a delivery receipt is not content) or waits for the hand-back and re-arms the meta's wait; it never closes first and asks later.
  live-work-approval:
    kind: semantic
    pass: While the meta may still be live (no hand-back, no exited read), the actor requires the user's approval before closing its tab, or defers the close entirely.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (the incident report, the repair diff, the test's own history) as a source; other cortex content is allowed.
