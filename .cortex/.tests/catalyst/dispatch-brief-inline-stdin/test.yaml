# test.yaml: guards the rule repaired by the incident-driven fix for
# 2026-08-06-dispatch-brief-staged-in-tmp.md. The rule: a c2d dispatch input
# document travels inline on stdin, a heredoc written at the call site, and the
# brief texts are authored inside that heredoc. Staging the briefs in a scratch
# file (/tmp or anywhere else) and assembling the document from them (jq
# --rawfile, $(cat), paste) is the same violation as dispatch < /tmp/x.json.
# The orchestrator's 2026-08-06 jq --rawfile staging of /tmp brief files is the
# recorded red baseline; this run is the Mode A replay on the repaired text.

# The agent under test: a fresh orchestrator session (omp) about to launch a
# wave. The role's configured model per models.yaml is kimi-code/k3, but the
# kimi provider was quota-blocked on 2026-08-06 (403, "usage limit", refresh
# ~19h), so the declared model is the orchestrator session's actual default
# per omp/agent/config.yml (modelRoles.default:
# opencode-go/deepseek-v4-flash at high). Same CLI (omp), same live model.
# Its model must differ from the judge model.
actor:
  role: orchestrator-default
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# mandate_mode omitted: c2d injects its standard launch mandate, exactly as a
# real orchestrator launch carries it.

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2/SKILL.md
  - skills/catalyst-v2-dispatch/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (dispatch-brief-inline-stdin/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident report 2026-08-06-dispatch-brief-staged-in-tmp.md, any plan under .cortex/plans, or this test's own history.
  - The actor must not modify the project working tree (/workspaces/catalyst) in any way, and runs no git commands.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criteria are implemented in checks.mjs.
criteria:
  inline-heredoc-launch:
    kind: semantic
    pass: The actor's launch command hands the dispatch input document to c2d dispatch inline on stdin as a heredoc written at the call site, with both brief texts authored inside the heredoc, and references no file anywhere in the flow (no --file, no redirect, no jq --rawfile, no $(cat), no scratch path).
  reads-dispatch-skill:
    kind: semantic
    pass: Before writing the invocation, the actor read the catalyst-v2-dispatch skill (the routing row in the catalyst-v2 bootstrap points launchers there) and its reasoning cites the skill's input-mode conventions.
  no-scratch-file-staging:
    kind: deterministic
    pass: The actor's invocation contains none of the scratch-staging markers: jq --rawfile, jq -n, $(cat, $(<, a redirect of the document from a file (dispatch < file), or a /tmp path inside the command.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (the incident report, the repair diff, the test's own history) as a source; other cortex content is allowed.
