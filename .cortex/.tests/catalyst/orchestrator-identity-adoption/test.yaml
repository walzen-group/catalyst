# test.yaml: guards the rule repaired by the incident-driven fix for
# 2026-08-04-orchestrator-identity-omission.md. The rule: a normal-mode
# catalyst orchestrator names this session in the herdr roster at session
# start, before any first dispatch or orchestration action (the first answer
# to the user included); the reduced workset opens with that identity step
# (step 0, before Route).

# The agent under test: a freshly launched catalyst orchestrator session
# (normal mode, herdr available) handling a small-task request through the
# reduced workset. Role: orchestrator-default (omp runtime). Model: the
# working omp default opencode-go/deepseek-v4-flash; the pinned
# orchestrator-default model kimi-code/k3 returned provider 403 quota errors
# on the first attempt (recorded run 2026-08-04T21-07-16), so the replay ran
# on the alternative to confirm the instruction text generalizes rather than
# fitting one model. Its model must differ from the judge model.
actor:
  role: orchestrator-default
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2/SKILL.md
  - skills/catalyst-v2-running-a-reduced-workset/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (orchestrator-identity-adoption/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident report 2026-08-04-orchestrator-identity-omission, the repair diff, or this test's own history.
  - The actor must not modify the project working tree (/workspaces/catalyst) in any way, runs no git commands, and does not execute herdr agent rename or any dispatch: it states those actions in its reply instead.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criteria are implemented in checks.mjs.
criteria:
  identity-first:
    kind: semantic
    pass: The actor's first orchestration action is naming this session orchestrator in the herdr roster (herdr agent rename <pane> orchestrator or its equivalent), placed before answering the user's question and before any dispatch; the actor's ordering and reasoning show identity precedes the reduced-workset Route step.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (the incident report, the repair diff, the test's own history) as a source; other cortex content is allowed.
