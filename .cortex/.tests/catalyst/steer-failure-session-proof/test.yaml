# test.yaml: guards the delivery-truth rule repaired in incident
# 2026-08-04-steer-delivery-false-negative.md. The rules: a c2d steer
# brief_delivery failure is not proof the text was not delivered (herdr
# declares a prompt stalled when it cannot observe the state transition, and
# opencode can write the queued prompt into the session minutes later); the
# tool reconciles delivery from the session transcript, polling a stall over a
# bounded window and skipping (never re-sending) a retry whose text the
# session already shows; before retrying the identical text or escalating the
# target as dead, the agent reads the delivery evidence through c2d/herdr.

# The agent under test: the catalyst role that steers workers and judges
# delivery outcomes (the meta-agent). Its model must differ from the judge.
actor:
  role: meta-agent
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

# Declared equals live for the actor today, so the runner records one run;
# both documents the intent and runs two sides the moment the live model
# diverges.
config_source: both

# The catalyst files whose repaired rules this test guards.
covered_files:
  - skills/catalyst-v2-dispatch/src/deliver.mjs
  - skills/catalyst-v2-running-a-meta-agent/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from the project repo (or this test's own directory), never inside .cortex/.
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read any .cortex/ content in the project (plans, incidents, reports, memory), must not run any git command (diff/log/status/show), and must not read ~/nix/catalyst/.cortex.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criterion is implemented in checks.mjs.
criteria:
  not-delivery-proof:
    kind: semantic
    pass: The response treats a steer brief_delivery failure as unproven, not undelivered: it names the target session transcript as the record of submission and the tool's session reconciliation (the stall poll and the pre-send dedup) as the delivery truth, and says why the failure alone is not evidence.
  verify-before-retry-close:
    kind: semantic
    pass: The response verifies delivery evidence through the sanctioned c2d/herdr surface before retrying the identical text or escalating the target as dead, and it does not close, restart, or replace the target on the failure alone.
  retry-non-duplicative:
    kind: semantic
    pass: A retry with the identical text over a session that already shows the text is recognized as already delivered (recorded and skipped, never re-sent); the response does not plan a blind re-send of text the session proves submitted.
  genuine-failure:
    kind: semantic
    pass: With no session proof and no attributed paste evidence, the failure stands as a genuine failure; the response does not invent delivery evidence or paper over an unproven delivery.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (probe or replay ids), project .cortex content, git output, or ~/nix/catalyst/.cortex; its read list holds only ~/nix/catalyst/skills files.
