# test.yaml: guards the composer-title-border repair in the dispatch tool.
#
# Claude Code 2.1.316 draws the generated session title inside the composer's
# top border. The pre-send read must locate that composer: an empty one takes
# the send, a real draft stays unchanged and its delivery is refused, and the
# queued-message hint permits delivery. Classification recognizes the live
# composer. The failure specimen comes from the capture tail, where
# the composer draws.
#
# The repair also carries the user-authorized shared-runner exception for the
# DeepSeek-only model policy: both roles name meta-agent in models.yaml (omp,
# thinking max), and the judge shares the actor's model id only under
# distinct_by: isolation, which names the fresh separate tab the judge still
# launches in. The default same-model refusal stays in force.

actor:
  role: meta-agent
  model: opencode-go/deepseek-v4.1-flash

# Declared at the user's DeepSeek-only model policy; the judge launches only in
# the meta-agent's coordinated replay, in its own fresh tab.
judge:
  role: meta-agent
  model: opencode-go/deepseek-v4.1-flash
  distinct_by: isolation

config_source: declared

covered_files:
  - skills/catalyst-v2-dispatch/src/screens.mjs
  - skills/catalyst-v2-dispatch/src/deliver.mjs
  - skills/catalyst-v2-dispatch/SKILL.md
  - skills/catalyst-v2-dispatch/test/helpers/harness.mjs
  - skills/catalyst-v2-dispatch/test/screens.test.mjs
  - skills/catalyst-v2-dispatch/test/deliver.test.mjs
  - .cortex/.tests/catalyst/lib/testspec.mjs
  - .cortex/.tests/catalyst/lib/resolve.mjs

isolation:
  - The actor works from this test's own directory (claude-composer-title-border/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read anything under .cortex/ other than this test's own scenario.md: plans, incidents, reports, memory, and this test's history are forbidden sources.
  - The actor writes scratch code only under /etc/nixos/nix/catalyst/.tmp/, runs no git commands, modifies no tracked file, and does not steer, dispatch, close, or type into any agent.

criteria:
  titled-composer-resolves:
    kind: semantic
    pass: The actor reports the titled-border capture resolving to an empty composer and does not call the screen a dialog.
  upgrade-check-named:
    kind: semantic
    pass: The actor names an idle-composer capture plus an empty extractComposer result as the post-upgrade check before trusting c2d delivery to a Claude tab.
  unit-pins-pass:
    kind: deterministic
    pass: The dispatch pins pass in the live tool directory, including the titled-border extraction, the titled empty-composer delivery, and the titled draft refusal.
  dispatch-pairing:
    kind: deterministic
    pass: The dispatch inputs built from this spec launch both roles on cli omp with thinking max and the DeepSeek Flash model, accepted only under distinct_by isolation.
  report-schema:
    kind: deterministic
    pass: The newest successful recorded run JSON matches the runner's record schema once a prior successful run exists; an errored record is skipped and the first run is not failed for having no prior record.
  no-contamination:
    kind: deterministic
    pass: The actor uses permitted source files. Concrete paths to forbidden .cortex plans, incidents, reports, memory or this test's history fail the check. Citations from the live SKILL.md upgrade note are permitted.
