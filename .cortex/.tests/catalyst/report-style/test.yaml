# test.yaml: guards the report-style rule repaired in incident
# 2026-08-03-report-style.md. The rule (catalyst-v2-writing-docs style rules,
# catalyst.md-derived): a user-facing report keeps technical identifiers
# (operationIds, schema names, paths, hashes, class names) in plain text,
# backticks only for shell commands / fenced blocks / literal option = value
# tokens, no bold emphasis in prose (bold only as the leading filename in a
# file-keyed bullet list), key/value data in tables. The artifact under test is
# the report text itself, not a recitation of the rules.

actor:
  role: report-writer
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

# Declared equals live for the actor today (deepseek is the live mid-tier
# model), so the runner records one run; both documents the intent and runs
# two sides the moment the live model diverges.
config_source: both

# The catalyst file whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2-writing-docs/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from this test's own directory (report-style/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read any .cortex/ content in the project (plans, incidents, reports, memory), must not run git diff/log/status, and must not read ~/nix/catalyst/.cortex.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criterion is implemented in checks.mjs.
criteria:
  plain-identifiers:
    kind: semantic
    pass: The produced report text puts technical identifiers (operationIds like auth.set, schema names like Config, file paths, hashes, class names) in plain text; inline single-backtick spans appear only around shell commands or literal option = value tokens, if at all.
  no-bold-runs:
    kind: semantic
    pass: The produced report text has no bold emphasis in prose; bold appears at most as the leading filename in a file-keyed bullet list.
  tables-for-data:
    kind: semantic
    pass: Key/value and structured data (family to missing counts, field to file) is presented as markdown tables rather than backtick-laden prose lists.
  no-contamination:
    kind: deterministic
    pass: The actor cites neither the incident report nor the test's own history as a source; project .cortex content (plans, incidents, the audit report), ~/nix/catalyst/.cortex, and git diffs are out of bounds entirely.
