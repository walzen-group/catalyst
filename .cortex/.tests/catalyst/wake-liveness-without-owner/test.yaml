# test.yaml: guards the tool-code repair from incident
# 2026-08-26-wake-liveness-without-owner. Two mechanical rules in c2d status /
# wake.mjs:
#
#   1. Wait ownership. A live `herdr agent wait <name>` is attributed to the
#      pane that owns it (read from the wait process's HERDR_PANE_ID via
#      /proc/<pid>/environ). The status wake block carries owner_pane, owner
#      (the owning agent's name), and owned_by_caller, and its note names the
#      owner and says "not you" when the reader is not the owner, so an agent
#      can no longer read another agent's wait as its own coverage.
#   2. An open wave is not read healthy. classify() returns healthy on "no
#      worker in flight" only when no meta is still open (present and not
#      exited); a meta parked with its own wake dead is UNWATCHED (stranded),
#      never a blanket healthy or the probe-first META QUIESCENT.
#
# Why no Mode A intent simulation: the failure class was an agent acting on a
# tool reading that answered the wrong question (a live wait reported without
# its owner; a wave read healthy the instant a worker settled). A meta was
# EXPLICITLY briefed to check its own wait was alive and complied as written;
# it checked, the check returned true, and the check was answering the wrong
# question. So the durable guard is the mechanics: the tool now attributes the
# wait and refuses the false-healthy, proven by the dispatch tool's own unit
# suite (test/wake.test.mjs, test/status.test.mjs) and by a live probe against
# a real herdr wait. This follows the foreground-wait-guard precedent for a
# mechanical tool-boundary fix. The first recorded run
# (history/2026-08-26-fix-mechanical-proof) transcribes the fix dispatch's
# red-then-green proof; the replay is never re-run for this purpose.
#
# The actor is a probe, not an intent simulation: the guarded behavior is the
# tool's, so the actor role is the suite-proven cheap row and is never launched
# for the transcribed run.

# The agent under test: a catalyst agent (meta-agent row). Its model must
# differ from the judge model. Declared but not launched for the transcribed
# first run (no semantic criteria).
actor:
  role: meta-agent
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor. Declared but
# never launched: this test has no semantic criteria.
judge:
  role: judge
  model: claude-opus-4-8

config_source: declared

# The catalyst files whose repaired rules this test guards.
covered_files:
  - skills/catalyst-v2-dispatch/src/wake.mjs
  - skills/catalyst-v2-dispatch/src/status.mjs

# Rules the actor runs under.
isolation:
  - The actor works from this test's own directory (wake-liveness-without-owner/).
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read the incident report (2026-08-26-wake-liveness-without-owner), the fix dispatch's materials, or this test's own history.
  - The actor must not modify the project working tree in any way, and runs no git commands.

# Pass criteria. All deterministic; each is implemented in checks.mjs. The
# judge is not launched (no semantic criteria).
criteria:
  wait-owner-attributed:
    kind: deterministic
    pass: readProcessOwner parses the owning HERDR_PANE_ID/HERDR_TAB_ID from a process environ, and liveWaitFor attaches owner_pane/owner_tab to a found wait; a wait whose environ names a different pane than the reader is attributable as not-the-reader's.
  status-note-names-owner:
    kind: deterministic
    pass: readStatus's wake block for a worker whose only live wait is owned by another pane reports owned_by_caller false, owner set to the owning agent, and a note that names the owner and says "not you"; the note never asserts bare coverage ("its owner will be woken").
  open-wave-stranded-meta-not-healthy:
    kind: deterministic
    pass: classify() does not read a settled-worker wave healthy when a meta is still open with its own wake dead (returns UNWATCHED naming the stranded meta); a settled-worker wave whose meta has retired (exited) is healthy, and one whose meta is verifying with a live wait is healthy.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of the dispatch materials (the incident report, the fix dispatch, the test's own history) as a source; other cortex content is allowed.
