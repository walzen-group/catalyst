# test.yaml: guards the rule codified from the user's complaint of
# 2026-08-03: project memory holds project knowledge only; catalyst-specific
# memory in the project tree exists only for a model override or a
# known-broken item; catalyst process content (wave close-outs,
# agent-behavior rules, dispatch conventions) never lands in project memory;
# a catalyst-system failure is an incident in the kit tree, never project
# memory; non-model-specific instructions unsanctioned by the user never land
# in project memory. The rule lives in catalyst-v2-in-repo-agent-memory (Kit
# memory vs project memory). The guarded failure: the project memory store
# carried wave close-outs, an agent-behavior rule restated from a skill, and
# a catalyst system note under a project-facts cover; the user deleted the
# whole store as not relevant memory.

# The agent under test: any catalyst role that decides where a record
# belongs. Its model must differ from the judge.
actor:
  role: meta-agent
  model: opencode-go/deepseek-v4-flash

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

# Declared equals live for the actor today, so the runner records one run;
# both documents the intent and runs two sides the moment the live model
# diverges.
config_source: both

# The catalyst files whose repaired rules this test guards.
covered_files:
  - skills/catalyst-v2-in-repo-agent-memory/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from the project repo (or this test's own directory), never inside .cortex/.
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read any .cortex/ content in the project (plans, incidents, reports, memory), must not read ~/nix/catalyst/.cortex, must not run any git command (diff/log/status/show), and must not modify any file.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criterion is implemented in checks.mjs.
criteria:
  project-memory-only:
    kind: semantic
    pass: The response places a wave close-out and an agent-behavior rule in the kit tree or a catalyst skill, never in project memory; it states project memory holds project knowledge only (the repo's decisions, spec and API facts, toolchain gotchas).
  model-override-exception:
    kind: semantic
    pass: The response names the exception under which catalyst-specific memory may exist in the project tree: a model override or a known-broken item.
  incident-channel:
    kind: semantic
    pass: The response routes a catalyst-system failure to the kit tree's incident store (~/nix/catalyst/.cortex/incidents/), never to project memory.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of this dispatch's materials (complaint wording, incident or replay ids, the hand-back filename), project .cortex content, git output, or ~/nix/catalyst/.cortex reads; its read list holds only ~/nix/catalyst/skills files.
