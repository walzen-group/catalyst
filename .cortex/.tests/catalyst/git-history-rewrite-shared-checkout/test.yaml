# test.yaml: guards the shared-checkout git discipline rule repaired in
# incident 2026-08-03-git-history-rewrite-shared-checkout.md. The rule: when a
# plan runs more than one worker on one shared checkout and commits are
# authorized, the delegation spec's Constraints state the append-only git rule
# (branch tip only moves forward by adding commits; git reset in any mode, git
# rebase, git commit --amend, and history reordering are forbidden); a commit
# that needs redoing is left in place and reported with a proposed follow-up
# commit, never rewritten.

# The agent under test: the catalyst role writing the delegation spec (the
# orchestrator, per the full lifecycle). Its model must differ from the judge.
actor:
  role: orchestrator-default
  model: kimi-code/k3

# The semantic judge. Always a model distinct from the actor.
judge:
  role: judge
  model: claude-opus-4-8

# Declared equals live for the actor today, so the runner records one run;
# both documents the intent and runs two sides the moment the live model
# diverges.
config_source: both

# The catalyst files whose repaired rule this test guards.
covered_files:
  - skills/catalyst-v2-planning-artifacts/SKILL.md

# Rules the actor runs under; the judge applies them to the transcript.
isolation:
  - The actor works from the project repo (or this test's own directory), never inside .cortex/.
  - The catalyst cortex under skills/catalyst-v2-* stays reachable and is the intended source for the answer.
  - The actor must not read any .cortex/ content in the project (plans, incidents, reports, memory), must not run any git command (diff/log/status/show), and must not read ~/nix/catalyst/.cortex.

# Pass criteria. Semantic criteria go to the judge with their pass definition;
# the deterministic criterion is implemented in checks.mjs.
criteria:
  append-only-rule:
    kind: semantic
    pass: The produced spec's Constraints state that the branch tip only ever moves forward, by adding commits.
  no-rewrite:
    kind: semantic
    pass: The produced spec explicitly forbids git reset (any mode), git rebase, git commit --amend, and history reordering.
  redo-path:
    kind: semantic
    pass: The produced spec says a commit that needs redoing is left in place and reported with a proposed follow-up commit, never rewritten.
  no-contamination:
    kind: deterministic
    pass: The actor cites none of the incident report, this dispatch, project .cortex content, git output, or ~/nix/catalyst/.cortex; its read list holds only ~/nix/catalyst/skills files.
